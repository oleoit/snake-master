<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Master 🐍</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-green: #39ff14;
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --dark-bg: #0a0a12;
            --panel-bg: rgba(20, 20, 35, 0.8);
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 243, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(57, 255, 20, 0.15) 0%, transparent 50%),
                linear-gradient(0deg, rgba(0,0,0,0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.2) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 20px 20px, 20px 20px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            padding: 20px;
            box-sizing: border-box;
        }

        .header-container {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 6vw, 3.5rem);
            margin: 0;
            color: white;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 5px var(--neon-green), 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
        }

        .game-title .icon { display: inline-block; filter: drop-shadow(0 0 5px var(--neon-green)); }

        .score-panel {
            display: inline-flex;
            gap: 30px;
            background: var(--panel-bg);
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2) inset;
            margin-top: 10px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .score-item { display: flex; flex-direction: column; align-items: center; }
        .score-label { font-size: 0.8rem; color: var(--neon-blue); letter-spacing: 1px; }
        .score-value { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: white; }
        #highScoreVal { color: var(--neon-pink); text-shadow: 0 0 5px var(--neon-pink); }

        .main-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            position: relative;
        }

        .canvas-container {
            position: relative;
            padding: 5px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-green));
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5), 0 0 40px rgba(57, 255, 20, 0.3);
        }
        
        .canvas-container::before {
            content: ''; position: absolute; inset: 2px;
            background: var(--dark-bg); border-radius: 13px; z-index: 0;
        }

        canvas {
            position: relative; z-index: 1;
            background-color: #050508;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 10px;
            width: 85vw; height: 85vw;
            max-width: 450px; max-height: 450px;
            display: block;
        }

        .controls-panel {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .controls {
            display: grid;
            grid-template-areas: ". up ." "left down right";
            gap: 10px;
        }

        .btn-control {
            width: 65px; height: 65px;
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            color: var(--neon-blue);
            font-size: 1.8rem;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2), 0 0 10px rgba(0, 243, 255, 0.1) inset;
            transition: all 0.1s ease;
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .btn-control:active {
            transform: translateY(2px) scale(0.95);
            background: var(--neon-blue); color: var(--dark-bg);
            box-shadow: 0 0 20px var(--neon-blue);
            border-color: transparent;
        }

        .up { grid-area: up; } .down { grid-area: down; }
        .left { grid-area: left; } .right { grid-area: right; }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        footer b { color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }

        @media (orientation: landscape) and (min-width: 768px) {
            body { justify-content: center; padding: 10px; }
            .header-container { margin-bottom: 10px; }
            .main-content-wrapper {
                flex-direction: row;
                align-items: center;
                justify-content: center;
                gap: 40px;
            }
            canvas { width: 70vh; height: 70vh; max-width: 500px; max-height: 500px; }
            .controls-panel { padding: 15px; }
            .btn-control { width: 55px; height: 55px; font-size: 1.5rem; }
        }

        #gameOverModal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(15px); justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: linear-gradient(135deg, var(--panel-bg), rgba(0,0,0,0.9));
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
            padding: 40px; border-radius: 20px; text-align: center; width: 300px;
        }
        .modal-content h2 {
            font-family: 'Orbitron', sans-serif; color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink); margin-top: 0; font-size: 2rem;
        }
        .modal-score { font-size: 1.2rem; margin: 15px 0; color: #bdc3c7; }
        .modal-score span { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; }
        .btn-restart {
            background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
            color: var(--dark-bg); border: none; padding: 15px; width: 100%;
            border-radius: 50px; font-weight: 800; font-size: 1.2rem; margin-top: 25px;
            cursor: pointer; box-shadow: 0 0 20px rgba(57, 255, 20, 0.5); transition: 0.2s;
        }
        .btn-restart:hover { box-shadow: 0 0 30px rgba(57, 255, 20, 0.8); transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="game-title">Snake Master <span class="icon">🐍</span></h1>
        <div class="score-panel">
            <div class="score-item">
                <span class="score-label">SCORE</span>
                <span class="score-value" id="scoreVal">0</span>
            </div>
            <div class="score-item" style="border-left: 1px solid rgba(255,255,255,0.1); padding-left: 30px;">
                <span class="score-label">BEST</span>
                <span class="score-value" id="highScoreVal">0</span>
            </div>
        </div>
    </div>
    
    <div class="main-content-wrapper">
        <div class="canvas-container">
            <canvas id="gameCanvas" width="450" height="450"></canvas>
        </div>

        <div class="controls-panel">
            <div class="controls">
                <div class="btn-control up" onclick="handleBtn('up')">▲</div>
                <div class="btn-control left" onclick="handleBtn('left')">◀</div>
                <div class="btn-control down" onclick="handleBtn('down')">▼</div>
                <div class="btn-control right" onclick="handleBtn('right')">▶</div>
            </div>
        </div>
    </div>

    <footer>Developed by <b>Yutthana Pumamob</b></footer>

    <div id="gameOverModal">
        <div class="modal-content">
            <h2>GAME OVER!</h2>
            <div class="modal-score">SCORE: <span id="finalScore" style="color:var(--neon-green)">0</span></div>
            <div class="modal-score">BEST: <span id="modalHighScore" style="color:var(--neon-pink)">0</span></div>
            <button class="btn-restart" onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("scoreVal");
        const highScoreElement = document.getElementById("highScoreVal");
        const modal = document.getElementById("gameOverModal");
        const finalScoreElement = document.getElementById("finalScore");
        const modalHighScoreElement = document.getElementById("modalHighScore");

        const gridSize = 15; 
        let tileCount = canvas.width / gridSize;
        
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        highScoreElement.innerText = highScore;

        let score = 0, dx = 0, dy = 0;
        let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
        let foodX = 5, foodY = 5, gameActive = true, lastDir = "";

        // --- แก้ไข: ป้องกันหน้าจอเลื่อนเวลาเล่นเกม ---
        document.addEventListener("keydown", (e) => {
            // รายชื่อปุ่มที่ต้องการ block ไม่ให้ browser เลื่อนหน้าจอ
            const keysToBlock = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "];
            if (keysToBlock.includes(e.key)) {
                e.preventDefault();
            }

            if(e.keyCode === 37) handleBtn('left');
            if(e.keyCode === 38) handleBtn('up');
            if(e.keyCode === 39) handleBtn('right');
            if(e.keyCode === 40) handleBtn('down');
        });

        function handleBtn(dir) {
            if (dir === 'up' && lastDir !== 'down') { dx = 0; dy = -1; lastDir = 'up'; }
            if (dir === 'down' && lastDir !== 'up') { dx = 0; dy = 1; lastDir = 'down'; }
            if (dir === 'left' && lastDir !== 'right') { dx = -1; dy = 0; lastDir = 'left'; }
            if (dir === 'right' && lastDir !== 'left') { dx = 1; dy = 0; lastDir = 'right'; }
        }

        function main() {
            if (!gameActive) return;
            if (didGameEnd()) { showGameOver(); return; }
            setTimeout(() => {
                clearCanvas(); drawFood(); advanceSnake(); drawSnake(); main();
            }, 100);
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = (index === 0) ? "#39ff14" : "#00f3ff"; 
                ctx.shadowBlur = 15;
                ctx.shadowColor = (index === 0) ? "#39ff14" : "#00f3ff";
                ctx.beginPath();
                ctx.roundRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize-2, gridSize-2, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if (head.x === foodX && head.y === foodY) {
                score += 10;
                scoreElement.innerHTML = score;
                createFood();
            } else { if(dx !== 0 || dy !== 0) snake.pop(); }
            if(dx !== 0 || dy !== 0) snake.unshift(head);
        }

        function didGameEnd() {
            if (dx === 0 && dy === 0) return false;
            const hitWall = snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount;
            let hitSelf = false;
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) hitSelf = true;
            }
            return hitWall || hitSelf;
        }

        function showGameOver() {
            gameActive = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("snakeHighScore", highScore);
                highScoreElement.innerText = highScore;
            }
            finalScoreElement.innerText = score;
            modalHighScoreElement.innerText = highScore;
            modal.style.display = "flex";
        }

        function resetGame() {
            score = 0; scoreElement.innerHTML = "0"; dx = 0; dy = 0; lastDir = "";
            snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
            gameActive = true; modal.style.display = "none"; createFood(); main();
        }

        function createFood() {
            foodX = Math.floor(Math.random() * tileCount);
            foodY = Math.floor(Math.random() * tileCount);
            snake.forEach(part => { if(part.x === foodX && part.y === foodY) createFood(); });
        }

        function drawFood() {
            ctx.fillStyle = "#ff00ff"; 
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#ff00ff";
            ctx.beginPath();
            ctx.arc((foodX * gridSize) + gridSize/2, (foodY * gridSize) + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        createFood();
        main();
    </script>
</body>
</html>
