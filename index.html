<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Master 🐍</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>">
    
    <style>
        :root {
            --primary-green: #2ecc71;
            --dark-bg: #1a252f;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle, #2c3e50, #000);
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* --- Container หลัก จัดทุกอย่างให้อยู่กลางจอ --- */
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 10px;
        }

        .game-title {
            font-size: clamp(1.8rem, 5vw, 3rem);
            margin: 0 0 10px 0;
            color: var(--primary-green);
            font-weight: 800;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.6);
        }

        .score-board {
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: bold;
            color: #bdc3c7;
        }

        /* --- โซนจัดวางจอเกมและปุ่ม --- */
        .game-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            width: 100%;
            transition: all 0.3s ease;
        }

        canvas {
            border: 6px solid #34495e;
            border-radius: 12px;
            background-color: #000;
            box-shadow: 0 0 40px rgba(46, 204, 113, 0.25);
            /* ปรับขนาดจอให้ใหญ่ขึ้น */
            width: 100%;
            max-width: 600px; 
            height: auto;
            max-height: 65vh; 
        }

        /* --- ระบบปุ่มควบคุม (D-Pad) --- */
        .controls {
            display: grid;
            grid-template-areas: 
                ". up ."
                "left down right";
            gap: 15px;
        }

        .btn-control {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: white;
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
        }

        .btn-control:active {
            background: var(--primary-green);
            transform: scale(0.9);
            border-color: var(--primary-green);
        }

        .up { grid-area: up; }
        .down { grid-area: down; }
        .left { grid-area: left; }
        .right { grid-area: right; }

        /* --- การปรับแต่งตามทิศทางหน้าจอ (Responsive) --- */
        
        /* แนวตั้ง: ปุ่มอยู่ด้านล่าง */
        @media (orientation: portrait) {
            .game-area {
                flex-direction: column;
                gap: 25px;
            }
            canvas {
                max-width: 95vw;
                max-height: 50vh;
            }
            .btn-control { width: 65px; height: 65px; }
        }

        /* แนวนอน: ปุ่มอยู่ด้านขวา */
        @media (orientation: landscape) {
            .game-area {
                flex-direction: row;
            }
            canvas {
                max-width: 60vw;
                max-height: 75vh;
            }
        }

        footer {
            position: fixed;
            bottom: 10px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }
        footer b { color: var(--primary-green); }

        /* Popup Modal */
        #gameOverModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(8px);
            justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: #fff; color: #333; padding: 40px; border-radius: 25px;
            text-align: center; width: 85%; max-width: 350px;
        }
        .btn-restart {
            background: var(--primary-green); color: white; border: none; padding: 15px;
            font-size: 1.3rem; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1 class="game-title">SNAKE MASTER 🐍</h1>
        <div class="score-board">คะแนน: <span id="scoreVal" style="color:#fff">0</span></div>
        
        <div class="game-area">
            <canvas id="gameCanvas" width="600" height="600"></canvas>

            <div class="controls">
                <div class="btn-control up" onclick="handleBtn('up')">▲</div>
                <div class="btn-control left" onclick="handleBtn('left')">◀</div>
                <div class="btn-control down" onclick="handleBtn('down')">▼</div>
                <div class="btn-control right" onclick="handleBtn('right')">▶</div>
            </div>
        </div>
    </div>

    <footer>Developed by <b>Yutthana Pumamob</b></footer>

    <div id="gameOverModal">
        <div class="modal-content">
            <h2 style="color: #e74c3c; margin: 0; font-size: 2rem;">GAME OVER!</h2>
            <p style="font-size: 1.5rem; margin: 20px 0;">ได้คะแนน: <span id="finalScore" style="color: var(--primary-green); font-weight: bold;">0</span></p>
            <button class="btn-restart" onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("scoreVal");
        const modal = document.getElementById("gameOverModal");
        const finalScoreElement = document.getElementById("finalScore");

        // ขยับ Grid ตามขนาดจอใหม่ (600 / 30 = 20px ต่อช่อง)
        const gridSize = 30; 
        const tileCount = canvas.width / gridSize;

        let score = 0;
        let dx = 0, dy = 0;
        let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
        let foodX = 5, foodY = 5;
        let gameActive = true;

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") handleBtn('left');
            if (e.key === "ArrowUp") handleBtn('up');
            if (e.key === "ArrowRight") handleBtn('right');
            if (e.key === "ArrowDown") handleBtn('down');
        });

        function handleBtn(dir) {
            if (dir === 'up' && dy !== 1) { dx = 0; dy = -1; }
            if (dir === 'down' && dy !== -1) { dx = 0; dy = 1; }
            if (dir === 'left' && dx !== 1) { dx = -1; dy = 0; }
            if (dir === 'right' && dx !== -1) { dx = 1; dy = 0; }
        }

        function main() {
            if (!gameActive) return;
            if (didGameEnd()) { showGameOver(); return; }

            setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, 90); // ปรับให้งูวิ่งเร็วขึ้นนิดหน่อยเพื่อความท้าทาย
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#111";
            for(let i=0; i<canvas.width; i+=gridSize) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = (index === 0) ? "#2ecc71" : "#27ae60";
                ctx.shadowBlur = (index === 0) ? 15 : 0;
                ctx.shadowColor = "#2ecc71";
                ctx.beginPath();
                ctx.roundRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2, 8);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if (head.x === foodX && head.y === foodY) {
                score += 10;
                scoreElement.innerHTML = score;
                createFood();
            } else {
                if(dx !== 0 || dy !== 0) snake.pop();
            }
            if(dx !== 0 || dy !== 0) snake.unshift(head);
        }

        function didGameEnd() {
            if (dx === 0 && dy === 0) return false;
            const hitWall = snake[0].x < 0 || snake[0].x > tileCount - 1 || snake[0].y < 0 || snake[0].y > tileCount - 1;
            let hitSelf = false;
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) hitSelf = true;
            }
            return hitWall || hitSelf;
        }

        function showGameOver() {
            gameActive = false;
            finalScoreElement.innerText = score;
            modal.style.display = "flex";
        }

        function resetGame() {
            score = 0; scoreElement.innerHTML = "0";
            dx = 0; dy = 0;
            snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
            gameActive = true;
            modal.style.display = "none";
            createFood();
            main();
        }

        function createFood() {
            foodX = Math.floor(Math.random() * tileCount);
            foodY = Math.floor(Math.random() * tileCount);
            snake.forEach(part => { if(part.x === foodX && part.y === foodY) createFood(); });
        }

        function drawFood() {
            ctx.fillStyle = "#ff4757";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff4757";
            ctx.beginPath();
            ctx.arc((foodX * gridSize) + gridSize/2, (foodY * gridSize) + gridSize/2, gridSize/2 - 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        main();
        createFood();
    </script>
</body>
</html>
