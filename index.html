<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Snake Master 🐍</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle, #2c3e50, #000);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- ส่วน Header ใหม่ --- */
        .game-title {
            font-size: 3rem;
            margin: 0;
            margin-bottom: 5px;
            text-shadow: 3px 3px 5px rgba(0,0,0,0.5);
            color: #2ecc71; /* ใช้สีเขียวเดียวกับตัวงู */
            font-weight: 800;
            letter-spacing: 2px;
        }

        canvas {
            border: 8px solid #34495e;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.3);
            background-color: #000;
        }

        .score-board {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            color: #bdc3c7;
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        footer b {
            color: #2ecc71;
            font-weight: 600;
        }

        #gameOverModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #fff;
            color: #333;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .btn-restart {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .btn-restart:hover {
            background: #27ae60;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <h1 class="game-title">SNAKE MASTER 🐍</h1>
    
    <div class="score-board">คะแนน: <span id="scoreVal" style="color: #fff;">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <footer>Developed by <b>Yutthana Pumamob</b></footer>

    <div id="gameOverModal">
        <div class="modal-content">
            <h2 style="font-size: 2.5rem; margin: 0; color: #e74c3c;">GAME OVER! 🐍</h2>
            <p style="font-size: 1.5rem; margin: 20px 0;">คะแนนที่คุณทำได้: <span id="finalScore" style="color: #2ecc71; font-weight: bold;">0</span></p>
            <button class="btn-restart" onclick="resetGame()">เล่นอีกครั้ง</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("scoreVal");
        const modal = document.getElementById("gameOverModal");
        const finalScoreElement = document.getElementById("finalScore");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let score = 0;
        let dx = 0, dy = 0;
        let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
        let foodX = 5, foodY = 5;
        let gameActive = true;

        document.addEventListener("keydown", changeDirection);

        function main() {
            if (!gameActive) return;
            if (didGameEnd()) { showGameOver(); return; }

            setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, 100);
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#111";
            for(let i=0; i<canvas.width; i+=gridSize) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = (index === 0) ? "#2ecc71" : "#27ae60";
                ctx.beginPath();
                ctx.roundRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2, 5);
                ctx.fill();
            });
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if (head.x === foodX && head.y === foodY) {
                score += 10;
                scoreElement.innerHTML = score;
                createFood();
            } else {
                if(dx !== 0 || dy !== 0) snake.pop();
            }
            if(dx !== 0 || dy !== 0) snake.unshift(head);
        }

        function didGameEnd() {
            if (dx === 0 && dy === 0) return false;
            const hitWall = snake[0].x < 0 || snake[0].x > tileCount - 1 || snake[0].y < 0 || snake[0].y > tileCount - 1;
            let hitSelf = false;
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) hitSelf = true;
            }
            return hitWall || hitSelf;
        }

        function showGameOver() {
            gameActive = false;
            finalScoreElement.innerText = score;
            modal.style.display = "flex";
        }

        function resetGame() {
            score = 0; scoreElement.innerHTML = "0";
            dx = 0; dy = 0;
            snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
            gameActive = true;
            modal.style.display = "none";
            createFood();
            main();
        }

        function createFood() {
            foodX = Math.floor(Math.random() * tileCount);
            foodY = Math.floor(Math.random() * tileCount);
        }

        function drawFood() {
            ctx.fillStyle = "#e74c3c";
            ctx.beginPath();
            ctx.arc((foodX * gridSize) + gridSize/2, (foodY * gridSize) + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            if (keyPressed === 37 && dx !== 1) { dx = -1; dy = 0; }
            if (keyPressed === 38 && dy !== 1) { dx = 0; dy = -1; }
            if (keyPressed === 39 && dx !== -1) { dx = 1; dy = 0; }
            if (keyPressed === 40 && dy !== -1) { dx = 0; dy = 1; }
        }

        main();
        createFood();
    </script>
</body>
</html>
